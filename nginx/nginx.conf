# Единственная точка входа снаружи. uvicorn слушает только внутри docker-сети.

upstream kompas_backend {
    server backend:8000;
}

log_format webhook_fmt '$remote_addr - [$time_local] "$request" '
                       '$status $body_bytes_sent rt=$request_time';

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    # Запас по времени: backend может ждать ответ OpenRouter до 30 секунд
    proxy_connect_timeout 5s;
    proxy_send_timeout 35s;
    proxy_read_timeout 35s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://kompas_backend;
    }

    # Вебхук MAX — отдельный access-лог, чтобы отлаживать входящие события
    # платформы, не разгребая общий лог
    location /api/webhook/max {
        access_log /var/log/nginx/webhook_access.log webhook_fmt;
        client_max_body_size 5m;
        proxy_pass http://kompas_backend;
    }

    location /health {
        access_log off;
        proxy_pass http://kompas_backend;
    }
}

