# HTTPS на своём домене: Caddy получает и продлевает сертификат автоматически.
# Укажите DOMAIN=example.ru в .env, направьте DNS на сервер и откройте 80/443 TCP.
# docker compose -f docker-compose.yml -f docker-compose.ssl.yml up -d --build
# Без оверлея остаётся обычный HTTP на порту 80 для локального запуска.

services:
  caddy:
    environment:
      CADDY_SITE_ADDRESS: ${DOMAIN:?укажите DOMAIN в .env}
    ports:
      - "443:443"
      - "443:443/udp"
